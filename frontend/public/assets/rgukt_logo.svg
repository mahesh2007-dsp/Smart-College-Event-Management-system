<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <defs>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
  </defs>
  
  <!-- RGUKT Emblem Container Circle -->
  <g transform="translate(10, 10)">
    <circle cx="50" cy="50" r="48" fill="#ffffff" stroke="#991b1b" stroke-width="2.5" />
    <circle cx="50" cy="50" r="44" fill="none" stroke="#fecdd3" stroke-width="1.2" stroke-dasharray="3 2" />
    
    <!-- Iconic RGUKT Crimson Stylized Human Figure -->
    <!-- Head -->
    <circle cx="50" cy="30" r="11" fill="url(#maroonGrad)" />
    <!-- Raised Arms & Spanning Body -->
    <path d="M50 44 C42 44 26 30 18 18 C19 32 30 52 42 58 C32 72 20 88 12 96 C24 88 38 72 50 64 C62 72 76 88 88 96 C80 88 68 72 58 58 C70 52 81 32 82 18 C74 30 58 44 50 44 Z" fill="url(#maroonGrad)" />
  </g>
  
  <!-- University & System Title -->
  <text x="125" y="40" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#f8fafc" letter-spacing="0.5">RGUKT <tspan fill="#e11d48">RK VALLEY</tspan></text>
  <text x="125" y="62" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">SMART COLLEGE EVENT MANAGEMENT SYSTEM</text>
  <rect x="125" y="74" width="130" height="2" rx="1" fill="#e11d48" />
  <text x="264" y="79" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="0.8">IIIT RKV • SE LAB</text>
  <text x="125" y="96" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#64748b">Rajiv Gandhi University of Knowledge Technologies, Andhra Pradesh</text>
</svg>
